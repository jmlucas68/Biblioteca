<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lector CBR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg:#0b0e14; --panel:#171b24; --border:#303744; --fg:#eef1f7; --muted:#939dac; --accent:#8b7cf6; }
        * { box-sizing:border-box; }
        html, body { width:100%; height:100%; margin:0; }
        body { min-width:320px; overflow:hidden; display:grid; grid-template-rows:auto minmax(0,1fr) auto; color:var(--fg); background:var(--bg); font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
        button, input { font:inherit; }
        button, .button { min-height:36px; display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:7px 10px; border:1px solid transparent; border-radius:7px; color:var(--fg); background:transparent; cursor:pointer; text-decoration:none; }
        button:hover:not(:disabled), .button:hover, button.active { border-color:#57516f; background:#302d42; }
        button:focus-visible, input:focus-visible, .button:focus-visible { outline:3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset:2px; }
        button:disabled { opacity:.35; cursor:not-allowed; }
        .topbar { z-index:2; min-width:0; display:flex; align-items:center; gap:12px; padding:10px 14px; border-bottom:1px solid var(--border); background:var(--panel); box-shadow:0 4px 18px #0005; }
        .title { min-width:0; margin-right:auto; display:flex; flex-direction:column; gap:2px; }
        .title strong { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:14px; }
        .title span { color:var(--muted); font-size:11px; }
        .controls { display:flex; align-items:center; gap:4px; }
        .controls output { min-width:45px; text-align:center; color:var(--muted); font-size:11px; font-variant-numeric:tabular-nums; }
        .divider { width:1px; height:24px; margin:0 4px; background:var(--border); }
        #stage { min-height:0; overflow:auto; overscroll-behavior:contain; background:radial-gradient(circle at 50% 10%,#252a35 0,#12151c 58%,#090b10 100%); scrollbar-color:#535c6c #151922; }
        #pages { min-height:100%; }
        .comic-page { margin:0 auto; transition:width .18s ease, height .18s ease, max-width .18s ease; }
        .comic-page img { display:block; width:100%; height:auto; background:white; box-shadow:0 12px 38px #0009; }
        .comic-page figcaption { padding:9px 0 20px; color:#838c9b; text-align:center; font-size:11px; }
        body.single #pages { height:100%; display:flex; align-items:flex-start; justify-content:center; padding:26px; }
        body.single .comic-page { flex:none; height:100%; width:auto; max-width:none; display:flex; align-items:flex-start; justify-content:center; }
        body.single .comic-page img { width:auto; max-width:none; height:100%; max-height:none; object-fit:contain; }
        body.single .comic-page figcaption { display:none; }
        body.continuous #pages { padding:24px 0 56px; }
        body.continuous .comic-page { max-width:1100px; }
        .message { min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:30px; color:var(--muted); text-align:center; }
        .message strong { color:var(--fg); font-size:18px; }
        .spinner { width:28px; height:28px; border:3px solid #ffffff25; border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; }
        @keyframes spin { to { transform:rotate(360deg); } }
        .pagination { z-index:2; display:flex; align-items:center; justify-content:center; gap:22px; padding:9px 14px; border-top:1px solid var(--border); background:var(--panel); box-shadow:0 -4px 18px #0005; }
        .pagination label { display:flex; align-items:center; gap:7px; color:var(--muted); font-size:12px; }
        .pagination input { width:58px; padding:7px; border:1px solid #48505f; border-radius:6px; color:var(--fg); background:#0c0f15; text-align:center; }
        .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
        @media(max-width:720px) {
            .topbar { align-items:flex-start; padding:8px; gap:5px; }
            .title strong { max-width:30vw; }
            .controls { gap:0; }
            .controls button { min-width:34px; padding:6px; }
            .control-label, .controls output, .divider { display:none; }
            body.single #pages { padding:10px; }
            body.continuous #pages { padding-top:10px; }
            .pagination { justify-content:space-between; gap:5px; }
            .pagination button span { display:none; }
        }
    </style>
</head>
<body class="single">
    <header class="topbar">
        <div class="title"><strong id="bookTitle">Lector CBR</strong><span id="bookInfo">Preparando cómic…</span></div>
        <div class="controls" aria-label="Controles del lector">
            <button type="button" id="singleMode" class="active" title="Una página">▣ <span class="control-label">Una página</span></button>
            <button type="button" id="continuousMode" title="Lectura continua">☷ <span class="control-label">Continuo</span></button>
            <span class="divider"></span>
            <button type="button" id="zoomOut" aria-label="Reducir zoom">−</button>
            <output id="zoomValue" aria-label="Nivel de zoom">100%</output>
            <button type="button" id="zoomIn" aria-label="Aumentar zoom">+</button>
            <button type="button" id="fullscreen" aria-label="Pantalla completa">⛶</button>
            <a id="downloadLink" class="button" target="_blank" rel="noopener" title="Descargar CBR">⬇</a>
        </div>
    </header>
    <main id="stage">
        <div id="pages"><div class="message"><span class="spinner"></span><strong>Descargando el cómic…</strong><span>El archivo se procesa únicamente en este dispositivo.</span></div></div>
    </main>
    <footer class="pagination" id="pagination" hidden>
        <button type="button" id="previous">‹ <span>Anterior</span></button>
        <label><span class="sr-only">Página actual</span><input id="pageNumber" type="number" min="1" value="1"><span id="pageCount">de 0</span></label>
        <button type="button" id="next"><span>Siguiente</span> ›</button>
    </footer>

    <script type="module">
        import { createExtractorFromData } from './vendor/node-unrar-js/index.esm.js';

        const IMAGE_FILE = /\.(?:avif|bmp|gif|jpe?g|png|webp)$/i;
        const collator = new Intl.Collator('es', { numeric:true, sensitivity:'base' });
        const params = new URLSearchParams(location.search);
        const title = params.get('title') || 'Lector CBR';
        const sourceUrl = params.get('url') || '';
        const elements = {
            title:document.getElementById('bookTitle'), info:document.getElementById('bookInfo'), pages:document.getElementById('pages'),
            stage:document.getElementById('stage'), pagination:document.getElementById('pagination'), pageNumber:document.getElementById('pageNumber'),
            pageCount:document.getElementById('pageCount'), previous:document.getElementById('previous'), next:document.getElementById('next'),
            singleMode:document.getElementById('singleMode'), continuousMode:document.getElementById('continuousMode'), zoomOut:document.getElementById('zoomOut'),
            zoomIn:document.getElementById('zoomIn'), zoomValue:document.getElementById('zoomValue'), fullscreen:document.getElementById('fullscreen'),
            download:document.getElementById('downloadLink')
        };
        let pages = [];
        let currentPage = 0;
        let zoom = 1;
        let continuous = false;
        const objectUrls = [];

        document.title = `${title} · Lector CBR`;
        elements.title.textContent = title;

        function resolveDownloadUrl(url) {
            const match = String(url || '').match(/[?&]id=([a-zA-Z0-9_-]+)/) || String(url || '').match(/\/file\/d\/([a-zA-Z0-9_-]+)\//);
            return match?.[1] ? `https://perplexity-proxy-backend.vercel.app/api/drive-proxy?id=${encodeURIComponent(match[1])}` : url;
        }

        function mimeFor(name) {
            const extension = name.split('.').pop().toLowerCase();
            return ({ avif:'image/avif', bmp:'image/bmp', gif:'image/gif', jpeg:'image/jpeg', jpg:'image/jpeg', png:'image/png', webp:'image/webp' })[extension] || 'application/octet-stream';
        }

        function showError(message) {
            elements.pages.innerHTML = '';
            const wrapper = document.createElement('div');
            wrapper.className = 'message';
            const heading = document.createElement('strong');
            heading.textContent = 'No se puede abrir el cómic';
            const detail = document.createElement('span');
            detail.textContent = message;
            wrapper.append(heading, detail);
            elements.pages.append(wrapper);
            elements.info.textContent = 'Error al abrir el archivo';
        }

        function updateControls() {
            elements.zoomValue.textContent = `${Math.round(zoom * 100)}%`;
            elements.zoomOut.disabled = zoom <= .5;
            elements.zoomIn.disabled = zoom >= 2;
            elements.previous.disabled = currentPage === 0;
            elements.next.disabled = currentPage >= pages.length - 1;
            elements.pageNumber.value = String(currentPage + 1);
            elements.pageCount.textContent = `de ${pages.length}`;
        }

        function render() {
            elements.pages.innerHTML = '';
            const visiblePages = continuous ? pages.map((page, index) => ({ page, index })) : pages[currentPage] ? [{ page:pages[currentPage], index:currentPage }] : [];
            for (const { page, index } of visiblePages) {
                const figure = document.createElement('figure');
                figure.className = 'comic-page';
                if (continuous) {
                    figure.style.width = `${zoom * 100}%`;
                    figure.style.maxWidth = `${1100 * zoom}px`;
                } else {
                    // En vista única la página parte de la altura disponible.
                    // Escalar esa altura conserva la proporción y deja que el
                    // contenedor se desplace al ampliar la imagen.
                    figure.style.width = 'auto';
                    figure.style.maxWidth = 'none';
                    figure.style.height = `${zoom * 100}%`;
                }
                const image = document.createElement('img');
                image.src = page.url;
                image.alt = `Página ${index + 1}: ${page.name}`;
                image.loading = index < 3 ? 'eager' : 'lazy';
                const caption = document.createElement('figcaption');
                caption.textContent = `${index + 1} / ${pages.length}`;
                figure.append(image, caption);
                elements.pages.append(figure);
            }
            elements.pagination.hidden = continuous || !pages.length;
            elements.singleMode.classList.toggle('active', !continuous);
            elements.continuousMode.classList.toggle('active', continuous);
            document.body.classList.toggle('single', !continuous);
            document.body.classList.toggle('continuous', continuous);
            updateControls();
        }

        async function loadComic() {
            if (!sourceUrl) return showError('No se ha indicado ningún archivo CBR.');
            const downloadUrl = resolveDownloadUrl(sourceUrl);
            elements.download.href = downloadUrl;
            try {
                const [archiveResponse, wasmResponse] = await Promise.all([
                    fetch(downloadUrl, { credentials:'omit' }),
                    fetch('./vendor/node-unrar-js/js/unrar.wasm')
                ]);
                if (!archiveResponse.ok) throw new Error(`No se ha podido descargar el archivo (HTTP ${archiveResponse.status}).`);
                if (!wasmResponse.ok) throw new Error('No se ha podido iniciar el descompresor CBR.');
                elements.info.textContent = 'Descomprimiendo páginas…';
                const extractor = await createExtractorFromData({ data:await archiveResponse.arrayBuffer(), wasmBinary:await wasmResponse.arrayBuffer() });
                const archive = extractor.extract({ files:header => !header.flags.directory && IMAGE_FILE.test(header.name) });
                pages = [...archive.files].filter(file => file.extraction && IMAGE_FILE.test(file.fileHeader.name)).map(file => {
                    const url = URL.createObjectURL(new Blob([file.extraction], { type:mimeFor(file.fileHeader.name) }));
                    objectUrls.push(url);
                    return { name:file.fileHeader.name, url };
                }).sort((a, b) => collator.compare(a.name, b.name));
                if (!pages.length) throw new Error('El archivo CBR no contiene imágenes compatibles.');
                elements.info.textContent = `${pages.length} páginas`;
                render();
            } catch (error) {
                const message = String(error?.message || error || 'No se ha podido abrir el archivo.');
                showError(message.includes('ERAR_MISSING_PASSWORD') ? 'El cómic está protegido con contraseña.' : message);
            }
        }

        elements.previous.onclick = () => { currentPage = Math.max(0, currentPage - 1); render(); };
        elements.next.onclick = () => { currentPage = Math.min(pages.length - 1, currentPage + 1); render(); };
        elements.pageNumber.onchange = () => { currentPage = Math.min(pages.length - 1, Math.max(0, Number(elements.pageNumber.value) - 1)); render(); };
        elements.zoomOut.onclick = () => { zoom = Math.max(.5, Math.round((zoom - .1) * 10) / 10); render(); };
        elements.zoomIn.onclick = () => { zoom = Math.min(2, Math.round((zoom + .1) * 10) / 10); render(); };
        elements.singleMode.onclick = () => { continuous = false; render(); };
        elements.continuousMode.onclick = () => { continuous = true; render(); };
        elements.fullscreen.onclick = async () => { if (!document.fullscreenElement) await document.documentElement.requestFullscreen(); else await document.exitFullscreen(); };
        addEventListener('keydown', event => {
            if (continuous) return;
            if (event.key === 'ArrowLeft' && currentPage > 0) { currentPage--; render(); }
            if (event.key === 'ArrowRight' && currentPage < pages.length - 1) { currentPage++; render(); }
        });
        addEventListener('beforeunload', () => objectUrls.forEach(URL.revokeObjectURL));
        loadComic();
    </script>
</body>
</html>
